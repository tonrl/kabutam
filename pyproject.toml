[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kabutam"
version = "0.1.3"
description = "A terminal-based stock and portfolio tracking tool"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "yfinance",
    "wcwidth",
    "jpholiday"
]

[project.scripts]
kabutam = "kabutam.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kabutam*"]
